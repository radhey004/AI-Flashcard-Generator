version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379

  backend:
    build: ./backend
    command: npm run dev
    environment:
      - AI_SERVICE_URL=http://ai_service:8000
      - MONGO_URL=mongodb://mongo:27017/ai_flashcards
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      - mongo
      - redis
    ports:
      - 5000:5000
    volumes:
      - ./backend:/app

  ai_service:
    build: ./ai_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - AI_SERVICE_URL=http://ai_service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CACHE_TTL_SECONDS=3600
    ports:
      - 8000:8000
    volumes:
      - ./ai_service:/app

  worker:
    build: ./backend
    command: npm run start:worker
    environment:
      - AI_SERVICE_URL=http://ai_service:8000
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/ai_flashcards
    depends_on:
      - redis
      - mongo

volumes:
  mongo-data:
    driver: local
